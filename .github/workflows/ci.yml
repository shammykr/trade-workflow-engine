name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, build and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lint (Spotless / google-java-format)
        run: mvn -B spotless:check
      - name: Build and run integration tests (Testcontainers PostgreSQL + Redpanda)
        run: mvn -B verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: trade-workflow-engine-jar
          path: target/trade-workflow-engine.jar

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 180 postgres redpanda && docker compose up -d app
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: RFQ round trip (submit -> quote -> accept -> booked)
        run: |
          id=$(curl -fsS -X POST localhost:8080/api/rfqs -H 'content-type: application/json' \
            -d '{"clientId":"CI-CLIENT","underlier":"SX5E","productType":"AUTOCALLABLE","notional":1000000,"currency":"EUR","maturityMonths":24}' \
            | jq -r .id)
          for i in $(seq 1 30); do
            quote=$(curl -fsS "localhost:8080/api/rfqs/$id" | jq -r '.quotes[0].id // empty')
            [ -n "$quote" ] && break
            sleep 1
          done
          curl -fsS -X POST "localhost:8080/api/rfqs/$id/accept" -H 'content-type: application/json' -d "{\"quoteId\":\"$quote\"}"
          for i in $(seq 1 30); do
            status=$(curl -fsS "localhost:8080/api/rfqs/$id" | jq -r .status)
            [ "$status" = "BOOKED" ] && echo "RFQ $id booked" && exit 0
            sleep 1
          done
          echo "RFQ $id ended in $status"; exit 1
      - name: Logs
        if: always()
        run: docker compose logs app | tail -n 50
      - name: Stop stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
